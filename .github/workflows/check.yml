name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  build-windows:
    name: Build Windows x64 plugin
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Check out Windows Core and SDK sources
        uses: actions/checkout@v6
        with:
          repository: WAAutoMaton/fcitx5-windows
          ref: master
          path: fcitx5-windows
          submodules: recursive
      - name: Install Core and plugin dependencies
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 update failed.' }
          C:/msys64/usr/bin/pacman -S --noconfirm `
            mingw-w64-clang-x86_64-clang `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-pkgconf `
            mingw-w64-clang-x86_64-gettext-tools `
            mingw-w64-clang-x86_64-extra-cmake-modules `
            mingw-w64-clang-x86_64-dlfcn `
            mingw-w64-clang-x86_64-libuv `
            mingw-w64-clang-x86_64-boost `
            mingw-w64-clang-x86_64-zstd
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          Add-Content $env:GITHUB_PATH 'C:/msys64/clang64/bin'
      - name: Build matching Core and libime SDK
        working-directory: fcitx5-windows
        run: ./scripts/build-pinyin.ps1 -Prefix ./build/plugin-sdk/prefix -BuildRoot ./build/plugin-sdk -DataMode Prebuilt
      - name: Build Wenzhounese plugin
        run: |
          ./scripts/build-windows.ps1 `
            -WindowsSourceDirectory ./fcitx5-windows `
            -CorePrefix ./fcitx5-windows/build/plugin-sdk/prefix `
            -DependencyPrefix C:/msys64/clang64
      - name: Package Windows plugin
        env:
          PLUGIN_REVISION: ${{ github.sha }}
          PACKAGE_NAME: Fcitx5-Wenzhounese-${{ github.run_number }}-windows-x64
        run: |
          $prefix = 'build/windows/package'
          $stage = 'build/windows/runtime/wenzhounese'
          $output = 'build/windows/dist'
          New-Item -ItemType Directory -Force $stage, $output | Out-Null
          foreach ($file in @('bin/libIMEWenzhounese.dll', 'lib/fcitx5/libwenzhounese.dll',
              'share/fcitx5/addon/wenzhounese.conf', 'share/fcitx5/inputmethod/wenzhounese.conf',
              'share/libime/wenzhounese.dict', 'lib/libime/wenzhounese.lm', 'lib/libime/wenzhounese.lm.predict')) {
            if (!(Test-Path -LiteralPath "$prefix/$file" -PathType Leaf)) { throw "Missing plugin output: $file" }
            New-Item -ItemType Directory -Force (Split-Path "$stage/$file" -Parent) | Out-Null
            Copy-Item -LiteralPath "$prefix/$file" -Destination "$stage/$file"
          }
          Copy-Item -LiteralPath "$prefix/share/locale" -Destination "$stage/share/locale" -Recurse
          Copy-Item -LiteralPath LICENSES -Destination "$stage/LICENSES" -Recurse
          Copy-Item -LiteralPath README.md -Destination "$stage/README.md"
          $coreRevision = & git -C fcitx5-windows rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine the Core SDK revision.' }
          [ordered]@{
            architecture = 'x64'
            toolchain = 'MSYS2 clang64'
            pluginRepository = $env:GITHUB_REPOSITORY
            pluginRevision = $env:PLUGIN_REVISION
            coreRepository = 'WAAutoMaton/fcitx5-windows'
            coreRevision = $coreRevision
          } | ConvertTo-Json | Set-Content "$stage/manifest.json" -Encoding utf8
          $archive = "$output/$env:PACKAGE_NAME.zip"
          Compress-Archive -Path $stage -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE_NAME.zip`n" | Set-Content "$archive.sha256" -Encoding ascii -NoNewline
      - name: Verify packaged plugin loads and commits a candidate
        run: |
          $sdk = (Resolve-Path fcitx5-windows/build/plugin-sdk/prefix).Path.Replace('\', '/')
          $toolchain = (Resolve-Path fcitx5-windows/cmake/windows-addon-toolchain.cmake).Path.Replace('\', '/')
          cmake -S fcitx5-windows/tools/addon-probe -B build/windows/probe -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DFCITX5_WINDOWS_SDK=$sdk" `
            -DARCH=AMD64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            -DCMAKE_CXX_COMPILER=C:/msys64/clang64/bin/clang++.exe `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/clang64/bin/ninja.exe "-DCMAKE_INSTALL_PREFIX=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Addon probe configuration failed.' }
          cmake --build build/windows/probe
          if ($LASTEXITCODE -ne 0) { throw 'Addon probe build failed.' }
          cmake --install build/windows/probe
          if ($LASTEXITCODE -ne 0) { throw 'Addon probe installation failed.' }
          $archive = Get-ChildItem build/windows/dist -Filter '*.zip' -File
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath build/windows/verify
          $plugin = (Resolve-Path build/windows/verify/wenzhounese).Path.Replace('\', '/')
          & "$sdk/bin/addon_probe.exe" "$sdk" "$plugin" wenzhounese nei
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Wenzhounese plugin verification failed.' }
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-Wenzhounese-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            build/windows/dist/*.zip
            build/windows/dist/*.sha256
  release:
    name: Publish Nightly Build
    needs: build-windows
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '!release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Download Windows plugin
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-Wenzhounese-windows-x64
      - name: Create Nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          files=(Fcitx5-Wenzhounese-*-windows-x64.zip Fcitx5-Wenzhounese-*-windows-x64.zip.sha256)
          sha256sum --check -- *.sha256
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == "latest") | .id')
          tag_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [[ -n "$release_id" ]]; then
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          fi
          if [[ -n "$tag_ref" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
          gh release create latest "${files[@]}" --verify-tag \
            --title 'Nightly Build' --prerelease --generate-notes
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - uses: fcitx/github-actions@clang-format
  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git qt6-base qt6-wayland libxkbcommon qt6-webengine lua opencc
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v4
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DENABLE_EMOJI=Off -DUSE_SYSTEMD=Off
      - uses: actions/checkout@v4
        with:
          repository: fcitx/libime
          path: libime
          submodules: true
      - name: Cache libime data files
        uses: actions/cache@v4
        with:
          path: 'libime/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('libime/data/CMakeLists.txt') }}
      - name: Build and Install libime
        uses: fcitx/github-actions@cmake
        with:
          path: libime
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5-chinese-addons
          path: fcitx5-chinese-addons
      - name: Build and Install fcitx5-chinese-addons
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-chinese-addons
          cmake-option: >-
            -DENABLE_GUI=Off
      - uses: actions/checkout@v4
        with:
          path: libime-jyutping
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          source-root: libime-jyutping
      - name: Build and Install libime-jyutping
        uses: fcitx/github-actions@cmake
        with:
          path: libime-jyutping
      - name: Test
        run: |
          ctest --test-dir libime-jyutping/build
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v2
